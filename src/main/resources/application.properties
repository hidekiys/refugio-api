spring.application.name=refugio-api

# O render.com injeta a porta via variavel de ambiente PORT; default 8080 local.
server.port=${PORT:8080}

# Datas/horas em formato ISO-8601 no JSON (ex.: 2026-11-14T13:05:00), nao array.
spring.jackson.serialization.write-dates-as-timestamps=false

# Credenciais do Oracle sao lidas de env vars pela ConnectionFactory:
#   DB_URL, DB_USERNAME, DB_PASSWORD
# (defaults apontam para o Oracle 21c XE local - ver config/ConnectionFactory.java)
